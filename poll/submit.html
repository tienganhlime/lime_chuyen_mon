<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Gửi câu trả lời</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --pink:#FFD6E5; --pink-deep:#FF8FB8; --pink-shadow:#E06B98;
    --rose:#FFC9DC; --rose-deep:#FF9EC0;
    --peach:#FFDDB8; --peach-deep:#FFA85C;
    --butter:#FFEEB0; --butter-deep:#E8C766;
    --cream:#FFFBF3; --card:#FFFFFF;
    --ink:#6B4A5C; --ink-soft:#AD8598; --line:#FCE0EC;
    --shadow: 0 4px 0 rgba(107,74,92,0.10), 0 10px 26px rgba(255,143,184,0.18);
  }
  *{box-sizing:border-box;}
  @media (prefers-reduced-motion: reduce){ *{ animation:none !important; transition:none !important; } }
  html,body{ height:100%; }
  body{
    margin:0; position:relative; overflow-x:hidden;
    background:
      radial-gradient(circle at 8% 8%, rgba(255,214,229,0.7), transparent 42%),
      radial-gradient(circle at 92% 92%, rgba(255,221,184,0.65), transparent 42%),
      radial-gradient(circle at 85% 10%, rgba(255,238,176,0.55), transparent 38%),
      var(--cream);
    font-family:'Nunito', sans-serif; color:var(--ink);
    min-height:100vh;
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  h1,h2,.display{ font-family:'Baloo 2', sans-serif; }

  .deco{ position:fixed; z-index:0; pointer-events:none; opacity:0.5; animation:float 7s ease-in-out infinite; }
  @keyframes float{ 0%,100%{ transform:translateY(0) rotate(0deg);} 50%{ transform:translateY(-14px) rotate(8deg);} }
  .deco.d1{ top:5%; left:4%; width:38px; }
  .deco.d2{ top:10%; right:6%; width:30px; animation-delay:1s; animation-duration:8s; }
  .deco.d3{ bottom:8%; left:5%; width:32px; animation-delay:1.8s; animation-duration:6.5s; }
  .deco.d4{ bottom:12%; right:5%; width:26px; animation-delay:0.5s; animation-duration:7.5s; }

  .wrap{ width:100%; max-width:460px; position:relative; z-index:1; }
  .card{ background:var(--card); border-radius:28px; box-shadow:var(--shadow); border:2px solid var(--line); padding:32px 26px; text-align:center; animation:popIn .35s ease; }
  @keyframes popIn{ from{ opacity:0; transform:translateY(12px) scale(.97);} to{ opacity:1; transform:translateY(0) scale(1);} }

  .mascot{ width:78px; height:78px; margin:0 auto 14px; display:block; animation:bob 3.2s ease-in-out infinite; }
  @keyframes bob{ 0%,100%{ transform:translateY(0) rotate(-2deg);} 50%{ transform:translateY(-6px) rotate(2deg);} }
  h1{ font-size:1.35rem; margin:0 0 6px; }
  p.sub{ color:var(--ink-soft); margin:0 0 22px; font-size:0.94rem; }
  label{ font-weight:800; font-size:0.9rem; display:block; margin-bottom:6px; text-align:left; }
  input[type=text], textarea{
    width:100%; font-family:'Nunito',sans-serif; font-size:16px;
    padding:13px 15px; border-radius:14px; border:2px solid var(--line);
    background:var(--cream); color:var(--ink); resize:vertical;
  }
  input[type=text]:focus, textarea:focus{ outline:none; border-color:var(--pink-deep); }
  .field{ margin-bottom:16px; text-align:left; }
  button.primary{
    width:100%; font-family:'Baloo 2', sans-serif; font-weight:700; font-size:1.05rem;
    padding:15px; border-radius:16px; border:none; background:var(--pink-deep); color:white;
    cursor:pointer; box-shadow:0 3px 0 var(--pink-shadow); transition:.1s; position:relative; overflow:visible;
  }
  button.primary:active{ transform:translateY(2px); box-shadow:0 1px 0 var(--pink-shadow); }
  button.primary:disabled{ opacity:0.5; cursor:not-allowed; }
  .error-msg{ color:#D2637A; font-weight:700; font-size:0.88rem; margin-top:10px; }

  .question-box{
    background:var(--peach); border:2px solid var(--peach-deep); border-radius:20px;
    padding:20px 22px; margin-bottom:18px; text-align:left; transition:.15s;
  }
  .qlabel{ font-size:0.8rem; font-weight:800; text-transform:uppercase; letter-spacing:1px; color:var(--peach-deep); margin-bottom:6px; }
  .qtext{ font-family:'Baloo 2', sans-serif; font-size:1.3rem; font-weight:700; line-height:1.4; }
  .qtext.pulse{ animation:qpulse .4s ease; }
  @keyframes qpulse{ 0%{ transform:scale(.96); opacity:.4;} 100%{ transform:scale(1); opacity:1;} }

  .toast{ display:none; background:var(--pink); color:var(--pink-shadow); font-weight:800; padding:12px 16px; border-radius:14px; margin-top:14px; font-size:0.92rem; }
  .name-pill{ display:inline-block; background:var(--butter); color:var(--ink); padding:5px 14px; border-radius:20px; font-size:0.84rem; font-weight:800; margin-bottom:14px; }
  .switch-name{ background:none; border:none; text-decoration:underline; color:var(--ink-soft); font-size:0.8rem; cursor:pointer; margin-top:10px; }
  #screenLoading, #screenCode, #screenName, #screenWait, #screenAnswer{ display:none; }

  .waiting-orbit{ position:relative; width:100px; height:100px; margin:6px auto 18px; }
  .waiting-orbit .balloon{ position:absolute; width:20px; height:26px; border-radius:50% 50% 50% 50% / 55% 55% 45% 45%; animation:orbit 3.6s linear infinite; }
  .waiting-orbit .b1{ background:var(--pink-deep); animation-delay:0s; }
  .waiting-orbit .b2{ background:var(--peach-deep); animation-delay:-1.2s; }
  .waiting-orbit .b3{ background:var(--butter-deep); animation-delay:-2.4s; }
  @keyframes orbit{
    0%{ transform: rotate(0deg) translateX(38px) rotate(0deg); }
    100%{ transform: rotate(360deg) translateX(38px) rotate(-360deg); }
  }
  .wait-title{ font-size:1.25rem; margin-bottom:6px; }

  @media (max-width:380px){
    .card{ padding:24px 18px; border-radius:22px; }
    .mascot{ width:64px; height:64px; }
    .qtext{ font-size:1.12rem; }
    h1{ font-size:1.18rem; }
  }
  @media (max-height:560px) and (orientation:landscape){
    .mascot{ width:48px; height:48px; margin-bottom:8px; }
    .card{ padding:20px 22px; }
    p.sub{ margin-bottom:14px; }
  }
</style>
</head>
<body>
  <svg class="deco d1" viewBox="0 0 40 40"><path d="M20 4 L23 15 L34 15 L25 22 L28 33 L20 26 L12 33 L15 22 L6 15 L17 15 Z" fill="#FF9EC0"/></svg>
  <svg class="deco d2" viewBox="0 0 40 40"><path d="M20 34 C6 24 6 10 16 10 C20 10 20 14 20 14 C20 14 20 10 24 10 C34 10 34 24 20 34 Z" fill="#FFB37B"/></svg>
  <svg class="deco d3" viewBox="0 0 40 40"><circle cx="12" cy="12" r="4" fill="#E8C766"/><circle cx="26" cy="18" r="3" fill="#FF9EC0"/></svg>
  <svg class="deco d4" viewBox="0 0 40 40"><path d="M20 4 L23 15 L34 15 L25 22 L28 33 L20 26 L12 33 L15 22 L6 15 L17 15 Z" fill="#FFEEB0"/></svg>

<div class="wrap">
  <div class="card" id="mainCard">
    <svg class="mascot" viewBox="0 0 100 100"><circle cx="50" cy="55" r="34" fill="#FFB8D2"/><circle cx="38" cy="50" r="5" fill="#6B4A5C"/><circle cx="62" cy="50" r="5" fill="#6B4A5C"/><path d="M40 62 Q50 70 60 62" stroke="#6B4A5C" stroke-width="3.5" fill="none" stroke-linecap="round"/><ellipse cx="50" cy="24" rx="14" ry="10" fill="#FFEEB0"/></svg>

    <div id="screenLoading">
      <p class="sub">Đang tải phòng hỏi đáp...</p>
    </div>

    <div id="screenCode">
      <h1>Tham gia phòng hỏi đáp</h1>
      <p class="sub">Nhập mã phiên do host cung cấp</p>
      <div class="field">
        <input type="text" id="codeInput" placeholder="VD: 7K2X9M" style="text-transform:uppercase; text-align:center; font-family:'Baloo 2'; font-size:1.2rem; letter-spacing:2px;">
      </div>
      <button class="primary" onclick="submitCode()">Vào phòng</button>
      <div id="codeError" class="error-msg"></div>
    </div>

    <div id="screenName">
      <h1>Xin chào 👋</h1>
      <p class="sub" id="nameSessionTitle">—</p>
      <div class="field">
        <label>Tên của bạn</label>
        <input type="text" id="nameInput" placeholder="Nhập tên để gửi câu trả lời">
      </div>
      <button class="primary" onclick="submitName()">Tiếp tục</button>
      <div id="nameError" class="error-msg"></div>
    </div>

    <div id="screenWait">
      <div class="waiting-orbit">
        <div class="balloon b1"></div><div class="balloon b2"></div><div class="balloon b3"></div>
      </div>
      <h1 class="wait-title">Sắp bắt đầu rồi! 🎈</h1>
      <p class="sub" id="waitSessionTitle">Đang chờ host bắt đầu phòng hỏi đáp...</p>
    </div>

    <div id="screenAnswer">
      <div class="name-pill" id="whoami" style="display:none;"></div>
      <div class="question-box">
        <div class="qlabel" id="qCounter">Câu hỏi</div>
        <div class="qtext" id="qText">—</div>
      </div>
      <div class="field">
        <label>Câu trả lời của bạn</label>
        <textarea id="answerInput" rows="4" placeholder="Nhập câu trả lời, gửi bao nhiêu lần cũng được..."></textarea>
      </div>
      <button class="primary" id="sendBtn" onclick="sendAnswer()">Gửi câu trả lời</button>
      <div class="toast" id="toast">Đã gửi! Cảm ơn bạn 🎉 Bạn có thể gửi tiếp nếu muốn.</div>
      <div id="answerError" class="error-msg"></div>
      <div><button class="switch-name" onclick="clearName()" id="changeNameBtn" style="display:none;">Không phải bạn? Đổi tên</button></div>
    </div>
  </div>
</div>

<script src="config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script>
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let sessionId = null;
let sessionData = null;
let myName = null;
let lastQuestionIndex = null;
let lastLiveState = null;

function showScreen(id){
  ['screenLoading','screenCode','screenName','screenWait','screenAnswer'].forEach(s=>{
    document.getElementById(s).style.display = (s===id) ? 'block' : 'none';
  });
}

window.addEventListener('DOMContentLoaded', ()=>{
  const params = new URLSearchParams(window.location.search);
  const codeFromUrl = params.get('session');
  if(codeFromUrl){
    showScreen('screenLoading');
    tryLoadSession(codeFromUrl.toUpperCase());
  } else {
    showScreen('screenCode');
  }
});

function submitCode(){
  const code = document.getElementById('codeInput').value.trim().toUpperCase();
  const err = document.getElementById('codeError');
  err.textContent = '';
  if(!code){ err.textContent = 'Nhập mã phiên nhé.'; return; }
  showScreen('screenLoading');
  tryLoadSession(code);
}

async function tryLoadSession(code){
  try{
    const doc = await db.collection('sessions').doc(code).get();
    if(!doc.exists){
      showScreen('screenCode');
      document.getElementById('codeError').textContent = 'Không tìm thấy phòng với mã này. Kiểm tra lại nhé.';
      return;
    }
    sessionId = code;
    sessionData = doc.data();
    afterSessionLoaded();
  }catch(e){
    console.error(e);
    showScreen('screenCode');
    document.getElementById('codeError').textContent = 'Có lỗi kết nối. Thử lại nhé.';
  }
}

function isLive(d){ return d.started !== false; }

function afterSessionLoaded(){
  if(!sessionData.anonymous){
    const savedName = localStorage.getItem('qa_name_' + sessionId);
    if(savedName){
      myName = savedName;
      enterMainFlow();
    } else {
      document.getElementById('nameSessionTitle').textContent = sessionData.title;
      showScreen('screenName');
    }
  } else {
    enterMainFlow();
  }
  listenToSession();
}

function submitName(){
  const name = document.getElementById('nameInput').value.trim();
  const err = document.getElementById('nameError');
  err.textContent = '';
  if(!name){ err.textContent = 'Nhập tên nhé.'; return; }
  myName = name;
  localStorage.setItem('qa_name_' + sessionId, name);
  enterMainFlow();
}

function clearName(){
  localStorage.removeItem('qa_name_' + sessionId);
  myName = null;
  document.getElementById('nameInput').value = '';
  document.getElementById('nameSessionTitle').textContent = sessionData.title;
  showScreen('screenName');
}

function enterMainFlow(){
  if(isLive(sessionData)){
    showAnswerScreen();
  } else {
    document.getElementById('waitSessionTitle').textContent = `Đang chờ host bắt đầu: "${sessionData.title}"`;
    showScreen('screenWait');
  }
}

function showAnswerScreen(){
  showScreen('screenAnswer');
  const whoami = document.getElementById('whoami');
  const changeBtn = document.getElementById('changeNameBtn');
  if(myName){
    whoami.textContent = 'Bạn: ' + myName;
    whoami.style.display = 'inline-block';
    changeBtn.style.display = 'inline';
  } else {
    whoami.style.display = 'none';
    changeBtn.style.display = 'none';
  }
  renderQuestion();
}

function listenToSession(){
  db.collection('sessions').doc(sessionId).onSnapshot(doc=>{
    if(!doc.exists) return;
    sessionData = doc.data();

    const nowLive = isLive(sessionData);
    if(lastLiveState !== null && lastLiveState !== nowLive){
      if(nowLive) showAnswerScreen();
      else {
        document.getElementById('waitSessionTitle').textContent = `Đang chờ host bắt đầu: "${sessionData.title}"`;
        showScreen('screenWait');
      }
    } else if(document.getElementById('screenAnswer').style.display === 'block'){
      renderQuestion();
    }
    lastLiveState = nowLive;
  });
}

function renderQuestion(){
  const qi = sessionData.currentIndex ?? 0;
  document.getElementById('qCounter').textContent = `Câu ${qi+1} / ${sessionData.questions.length} — ${sessionData.title}`;
  const qTextEl = document.getElementById('qText');
  qTextEl.textContent = sessionData.questions[qi] || '—';
  if(lastQuestionIndex !== null && lastQuestionIndex !== qi){
    qTextEl.classList.remove('pulse'); void qTextEl.offsetWidth; qTextEl.classList.add('pulse');
  }
  lastQuestionIndex = qi;
}

function launchConfetti(){
  const colors = ['#FF8FB8','#FFA85C','#E8C766','#FF9EC0'];
  for(let i=0;i<18;i++){
    const p = document.createElement('div');
    const size = 6 + Math.random()*5;
    p.style.position = 'fixed';
    p.style.left = (45 + Math.random()*10) + 'vw';
    p.style.top = '40vh';
    p.style.width = size+'px';
    p.style.height = size+'px';
    p.style.background = colors[Math.floor(Math.random()*colors.length)];
    p.style.borderRadius = Math.random()>0.5 ? '50%' : '3px';
    p.style.pointerEvents = 'none';
    p.style.zIndex = 999;
    const dx = (Math.random()-0.5)*220;
    const dy = 120 + Math.random()*160;
    const rot = (Math.random()-0.5)*720;
    p.animate([
      { transform:'translate(0,0) rotate(0deg)', opacity:1 },
      { transform:`translate(${dx}px, ${dy}px) rotate(${rot}deg)`, opacity:0 }
    ], { duration: 900 + Math.random()*400, easing:'cubic-bezier(.2,.8,.3,1)' });
    document.body.appendChild(p);
    setTimeout(()=> p.remove(), 1400);
  }
}

async function sendAnswer(){
  const input = document.getElementById('answerInput');
  const text = input.value.trim();
  const err = document.getElementById('answerError');
  const btn = document.getElementById('sendBtn');
  err.textContent = '';
  if(!text){ err.textContent = 'Nhập câu trả lời trước đã nhé.'; return; }

  btn.disabled = true;
  try{
    await db.collection('sessions').doc(sessionId).collection('answers').add({
      questionIndex: sessionData.currentIndex ?? 0,
      text: text,
      name: myName || null,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    input.value = '';
    const toast = document.getElementById('toast');
    toast.style.display = 'block';
    launchConfetti();
    setTimeout(()=> toast.style.display='none', 2200);
  }catch(e){
    console.error(e);
    err.textContent = 'Gửi không thành công, thử lại nhé.';
  }finally{
    btn.disabled = false;
  }
}
</script>
</body>
</html>
