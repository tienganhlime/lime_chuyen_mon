<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
  apiKey: "AIzaSyCou-Dl3q131fc3Xb4ZtdIN1sQnOQzjv2o",
  authDomain: "thoikhoabieu-ad275.firebaseapp.com",
  projectId: "thoikhoabieu-ad275",
  storageBucket: "thoikhoabieu-ad275.firebasestorage.app",
  messagingSenderId: "1061088618877",
  appId: "1:1061088618877:web:c1d701bbb0cd4bc7c00414"
};

  const app = initializeApp(firebaseConfig);
  const db  = getFirestore(app);

  window._fbSaveMonth = async function(child, month, data) {
    await setDoc(doc(db, child, "thang_" + month), data);
  };
  window._fbLoadMonth = async function(child, month) {
    const snap = await getDoc(doc(db, child, "thang_" + month));
    return snap.exists() ? snap.data() : null;
  };
  window._fbSaveBlocks = async function(child, data) {
    await setDoc(doc(db, child, "blocks"), data);
  };
  window._fbLoadBlocks = async function(child) {
    const snap = await getDoc(doc(db, child, "blocks"));
    return snap.exists() ? snap.data() : null;
  };

  window.addEventListener("load", () => window.fbAutoLoad && window.fbAutoLoad());
  console.log("✅ Firebase connected:", app.options.projectId);
</script>
<style>
:root {
  --pink:#FF85A1; --pink-l:#FFD6E0; --pink-bg:#FFF0F3;
  --teal:#34D399; --teal-l:#D1FAE5;
  --blue:#60A5FA; --blue-l:#DBEAFE;
  --bg:#FFF8FA; --card:#FFFFFF; --border:#FFD6E0;
  --text:#3D1A24; --text2:#9B6375; --text3:#C4A0AD;
  --shadow:0 4px 20px rgba(255,133,161,0.13);
  --r:14px;

*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{

.toolbar{display:flex;gap:6px;align-items:center;justify-content:center;flex-wrap:wrap;padding:0 16px 8px}
.tb{font-family:'Baloo 2',cursive;font-size:14px;font-weight:700;padding:7px 18px;border-radius:30px;border:2px solid;cursor:pointer;transition:all .15s}
.tb.save{border-color:var(--teal);color:#059669;background:var(--teal-l)}
.tb.save:hover{background:var(--teal);color:#fff}
.tb.load{border-color:var(--blue);color:#2563EB;background:var(--blue-l)}
.tb.load:hover{background:var(--blue);color:#fff}
.tb.danger{border-color:#FCA5A5;color:#DC2626;background:#FEF2F2}
.tb.danger:hover{background:#EF4444;color:#fff}
.tb.export{border-color:#FCD34D;color:#92400E;background:#FEF3C7}
.tb.export:hover{background:#F59E0B;color:#fff;border-color:#F59E0B}
.sep{width:1px;height:26px;background:var(--border);flex-shrink:0}

.pal-bar{background:var(--card);border-top:1.5px solid var(--border);border-bottom:1.5px solid var(--border);padding:7px 16px}
.pal-groups{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
.pal-grp{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.pal-lbl{font-family:'Baloo 2',cursive;font-size:11px;font-weight:700;color:var(--text3);white-space:nowrap;margin-right:2px}
.chip{

  transition:transform .1s;white-space:nowrap;display:flex;align-items:center;gap:3px
}
.chip:active{cursor:grabbing;transform:scale(1.05)}
.chip.drag{opacity:0.35}
.chip-x{
  display:none;width:15px;height:15px;border-radius:50%;
  background:rgba(0,0,0,0.2);border:none;cursor:pointer;color:inherit;
  font-size:9px;font-weight:900;align-items:center;justify-content:center;
  flex-shrink:0;padding:0
}
.chip:hover .chip-x{display:flex}
.vsep{width:1px;height:26px;background:var(--border);flex-shrink:0;align-self:center}

.add-form{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding-top:8px;border-top:1px dashed var(--border);margin-top:8px}
.add-form input{font-family:'Nunito',sans-serif;font-size:13px;padding:5px 10px;border-radius:10px;border:1.5px solid var(--border);background:var(--bg);color:var(--text);outline:none;width:170px}

.grid-wrap{padding:8px 10px 24px;overflow-x:hidden}
table.sc{border-collapse:collapse;table-layout:fixed;width:100%}
table.sc th{

  text-align:center;padding:6px 4px;
  background:var(--card);border-bottom:2.5px solid var(--pink-l);
  color:var(--text2);position:sticky;top:0;z-index:10
}
table.sc th.tc{width:var(--time-col);font-size:11px;color:var(--text3)}
table.sc th .dn{font-size:15px;color:var(--text);display:block;font-weight:800}

table.sc td.tc{
  font-size:11px;color:var(--text3);font-weight:700;
  text-align:right;padding-right:5px;
  border-right:2px solid var(--pink-l);
  vertical-align:top;padding-top:2px;width:var(--time-col);white-space:nowrap
}
table.sc td.tc.oh{color:var(--text2);font-size:12px}
table.sc td.slot{
  height:var(--cell-h);
  border:0.5px solid #FFE4ED;vertical-align:top;position:relative;cursor:default;transition:background .1s
}
table.sc tr:nth-child(4n+1) td.slot{background:rgba(255,255,255,0.5)}
table.sc td.slot.ohr{border-top:1.5px solid #FFB3C6}
table.sc td.slot.dov{background:#D1FAE5!important;outline:2px dashed #34D399;outline-offset:-2px;z-index:5}

.pb{

  padding:0 4px;text-align:center;line-height:1.15;overflow:hidden;border:1.5px solid transparent
}
.pb:active{cursor:grabbing}
.pbx{display:none;position:absolute;top:2px;right:3px;font-size:10px;cursor:pointer;background:none;border:none;color:inherit;font-weight:900;padding:0;opacity:0.75;line-height:1}
.pb:hover .pbx{display:block}
.pb-span{z-index:8}
.pb-resize{
  position:absolute;left:4px;right:4px;bottom:0;height:9px;
  cursor:ns-resize;display:flex;align-items:center;justify-content:center;z-index:6
}
.pb-resize::before{content:'';width:24px;height:3px;border-radius:3px;background:rgba(0,0,0,0.18);transition:background .12s}

.pb.resizing{box-shadow:0 3px 12px rgba(0,0,0,0.20);z-index:20}
#resize-ghost{position:fixed;display:none;height:0;border-top:3px dashed #FF85A1;z-index:9999;pointer-events:none}
.resize-ghost-label{
  position:absolute;right:0;top:-12px;color:#fff;

.child-tabs{display:flex;gap:0;justify-content:center;padding:0 0 0;border-bottom:2.5px solid var(--pink-l);}
.child-tab{

  transition:all .18s;border-radius:12px 12px 0 0;

.child-tab:hover{background:var(--pink-bg);color:var(--pink)}

  box-shadow:0 -2px 12px rgba(255,133,161,0.10);
}
.child-tab.melinh-tab{color:var(--text2)}

.child-tab.melinh-tab.active{color:#059669;border-bottom-color:#059669;background:var(--card)}

.icon-modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:2000;align-items:center;justify-content:center}

</head>
<body>

<div class="hdr">

  <p>Kéo thả các khối vào lưới giờ — mỗi ô = 30 phút ✨</p>
</div>

<div class="child-tabs">
  <button class="child-tab active" id="tab-honey" onclick="switchChild('honey',this)">
    🍯 Honey
  </button>
  <button class="child-tab" id="tab-moon" onclick="switchChild('moon',this)">
    🌙 Moon
  </button>
  <button class="child-tab melinh-tab" id="tab-melinh" onclick="switchChild('melinh',this)">
    🌿 Mẹ Linh
  </button>
</div>

<div class="toolbar">
  <button class="tb save" onclick="fbSaveMonth()">☁️ Lưu Cloud</button>
  <button class="tb load" onclick="fbLoadMonth()">🔄 Tải Cloud</button>
  <button class="tb save" style="border-color:#d1d5db;color:#6b7280;background:#f9fafb" onclick="saveData()">💾 Lưu file</button>
  <button class="tb load" style="border-color:#d1d5db;color:#6b7280;background:#f9fafb" onclick="loadData()">📂 Mở file</button>
  <button class="tb export" onclick="openExportModal()">📤 Xuất ảnh/PDF</button>
  <button class="tb danger" onclick="clearWeek()">🗑 Xóa tuần</button>
</div>
<div id="fb-status" style="text-align:center;font-size:12px;color:#9B6375;padding:2px 0 6px;font-family:Nunito,sans-serif;font-weight:700;min-height:20px"></div>

<div class="pal-bar">
  <div class="pal-groups" id="pal-groups"></div>
  <div class="add-form">
    <button id="icon-pick-btn" onclick="openIconPicker()" style="font-size:20px;padding:4px 8px;border:2px solid var(--pink-l);border-radius:8px;background:var(--pink-bg);cursor:pointer;" title="Chọn icon">✨</button>

    <div id="cdots" style="display:flex;gap:5px"></div>
    <button class="add-btn" onclick="addCustom()">+ Thêm</button>
  </div>
</div>

<div class="grid-wrap" id="grid-wrap">
  <table class="sc" id="sc"></table>
</div>

<!-- Icon Picker Modal -->
<div class="icon-modal-overlay" id="icon-modal">
  <div class="icon-modal">
    <h3>Chọn icon cho hoạt động</h3>
    <div class="icon-grid" id="icon-grid"></div>
    <div class="icon-modal-footer">
      <button class="modal-btn cancel" onclick="closeIconPicker()">Đóng</button>
    </div>
  </div>
</div>

<!-- Export Modal -->
<div class="modal-overlay" id="export-modal">
  <div class="modal">
    <h2>📤 Xuất Thời Khóa Biểu</h2>
    <p>Xuất lịch với layout đúng như màn hình.<br>Chọn định dạng bạn muốn lưu:</p>
    <div class="modal-btns">
      <button class="modal-btn img" onclick="exportImage()">🖼 Ảnh PNG</button>
      <button class="modal-btn pdf" onclick="exportPDF()">📄 File PDF</button>
      <button class="modal-btn cancel" onclick="closeExportModal()">Hủy</button>
    </div>
    <div class="export-loading" id="export-loading">⏳ Đang xuất, chờ chút nhé...</div>
  </div>
</div>

function renderGrid(){
  const days=DAYS;
  let h=`<thead><tr><th class="tc">Giờ</th>`;
  days.forEach(d=>{
    h+=`<th class="dc"><span class="dn">${d}</span></th>`;
  });
  h+=`</tr></thead><tbody>`;

  for(let s=SS;s<SE;s++){
    const oh=s%2===0;
    h+=`<tr>`;
    if(oh) h+=`<td class="tc oh" rowspan="2">${sl(s)}</td>`;

    days.forEach(day=>{
      let cls='slot';
      if(oh) cls+=' ohr';
      const bid=allGrids[curChild][curMonth][day][s];
      const prevBid=s>SS?allGrids[curChild][curMonth][day][s-1]:null;
      const isStart=bid && bid!==prevBid;
      h+=`<td class="${cls}" data-day="${day}" data-slot="${s}"
        ondragover="gov(event)" ondrop="gdp(event,this)" ondragleave="glv(this)">`;
      if(isStart){
        let e=s+1;
        while(e<SE && allGrids[curChild][curMonth][day][e]===bid) e++;
        const span=e-s;
        const b=getB(bid);
        if(b){
          const heightOverride=span>1?`height:calc(${span} * var(--cell-h) - 2px);bottom:auto;`:'';
          h+=`<div class="pb${span>1?' pb-span':''}" draggable="true"
            style="background:${b.bg};color:${b.color};border-color:${b.border};${heightOverride}"
            data-id="${b.id}" data-day="${day}" data-slot="${s}" data-span="${span}"
            ondragstart="pds(event,this)" ondragend="pde(this)">
            <span style="overflow:hidden;max-width:100%;white-space:nowrap;text-overflow:ellipsis;display:block">${b.label}</span>
            <button class="pbx" onclick="delB('${day}',${s},${span},event)">✕</button>
            <div class="pb-resize" draggable="false" ondragstart="return false"
              onmousedown="startResize(event,'${day}',${s},${span},'${b.id}')" title="Kéo để đổi độ dài"></div>
          </div>`;
        }
      }
      h+=`</td>`;
    });
    h+=`</tr>`;
  }
  h+=`</tbody>`;
  document.getElementById('sc').innerHTML=h;
  initDragScroll();
}

let autoScrollRAF=null;
let dragScrollSpeed=0;
const SCROLL_ZONE=80;
const MAX_SPEED=12;

function startAutoScroll(){
  if(autoScrollRAF) return;
  function loop(){
    if(dragScrollSpeed!==0) window.scrollBy(0,dragScrollSpeed);
    autoScrollRAF=requestAnimationFrame(loop);
  }
  autoScrollRAF=requestAnimationFrame(loop);
}
function stopAutoScroll(){
  if(autoScrollRAF){cancelAnimationFrame(autoScrollRAF);autoScrollRAF=null;}
  dragScrollSpeed=0;
}
function onDragOverWindow(e){
  const y=e.clientY,h=window.innerHeight;
  if(y<SCROLL_ZONE) dragScrollSpeed=-MAX_SPEED*((SCROLL_ZONE-y)/SCROLL_ZONE);
  else if(y>h-SCROLL_ZONE) dragScrollSpeed=MAX_SPEED*((y-(h-SCROLL_ZONE))/SCROLL_ZONE);
  else dragScrollSpeed=0;
}
document.addEventListener('dragover',onDragOverWindow);
document.addEventListener('dragstart',()=>startAutoScroll());
document.addEventListener('dragend',()=>stopAutoScroll());
document.addEventListener('drop',()=>stopAutoScroll());

function initDragScroll(){}

function gov(e){e.preventDefault();e.currentTarget.classList.add('dov');e.dataTransfer.dropEffect=dragFrom?'move':'copy'}
function glv(c){c.classList.remove('dov')}
function gdp(e,cell){
  e.preventDefault();cell.classList.remove('dov');
  const day=cell.dataset.day,slot=+cell.dataset.slot;
  if(dragId){
    let span=dragFrom?dragSpan:1;
    let start=slot;
    if(start+span>SE) start=Math.max(SS,SE-span);
    if(dragFrom){
      const[fd,fs]=dragFrom.split('|');
      const fSlot=+fs;
      for(let s=fSlot;s<fSlot+dragSpan;s++){allGrids[curChild][curMonth][fd][s]=null}
    }
    for(let s=start;s<start+span;s++){allGrids[curChild][curMonth][day][s]=dragId}
    dragId=null;dragFrom=null;dragSpan=1;renderGrid();
  }
}
function pds(e,el){
  dragId=el.dataset.id;dragFrom=el.dataset.day+'|'+el.dataset.slot;
  dragSpan=+el.dataset.span||1;
  e.dataTransfer.effectAllowed='move';
  setTimeout(()=>el.style.opacity='0.3',0);
}
function pde(el){el.style.opacity='1'}
function delB(day,slot,span,e){
  e.stopPropagation();
  for(let s=slot;s<slot+(span||1);s++){allGrids[curChild][curMonth][day][s]=null}
  renderGrid();
}

function calcMaxSpan(day,slotStart,id){
  let s=slotStart;
  while(s<SE){
    const v=allGrids[curChild][curMonth][day][s];
    if(v!==null && v!==undefined && v!==id) break;
    s++;
  }
  return s-slotStart;
}

let resizeState=null;

function ensureGhost(){
  let g=document.getElementById('resize-ghost');
  if(!g){
    g=document.createElement('div');
    g.id='resize-ghost';
    g.innerHTML='<span class="resize-ghost-label"></span>';
    document.body.appendChild(g);
  }
  g.style.display='block';
  return g;
}

function startResize(e,day,slotStart,initialSpan,id){
  e.preventDefault();e.stopPropagation();
  const pb=e.currentTarget.closest('.pb');
  const rect=pb.getBoundingClientRect();
  const rowHeight=rect.height/initialSpan;
  const maxSpan=calcMaxSpan(day,slotStart,id);
  resizeState={
    day,slotStart,initialSpan,id,startY:e.clientY,rowHeight,maxSpan,curSpan:initialSpan,
    left:rect.left,width:rect.width,top:rect.top,color:pb.style.borderColor||'#FF85A1'
  };
  pb.classList.add('resizing');
  ensureGhost();
  onResizeMove(e);
  document.addEventListener('mousemove',onResizeMove);
  document.addEventListener('mouseup',onResizeUp);
}

function onResizeMove(e){
  if(!resizeState) return;
  const st=resizeState;
  const deltaSlots=Math.round((e.clientY-st.startY)/st.rowHeight);
  let newSpan=st.initialSpan+deltaSlots;
  if(newSpan<1) newSpan=1;
  if(newSpan>st.maxSpan) newSpan=st.maxSpan;
  st.curSpan=newSpan;
  const g=ensureGhost();
  const y=st.top+newSpan*st.rowHeight;
  g.style.left=st.left+'px';
  g.style.width=st.width+'px';
  g.style.top=y+'px';
  g.style.borderTopColor=st.color;
  const label=g.querySelector('.resize-ghost-label');
  label.textContent=sl(st.slotStart)+' → '+sl(st.slotStart+newSpan);
  label.style.background=st.color;
}

function onResizeUp(e){
  if(!resizeState) return;
  const st=resizeState;
  document.removeEventListener('mousemove',onResizeMove);
  document.removeEventListener('mouseup',onResizeUp);
  const g=document.getElementById('resize-ghost');
  if(g) g.style.display='none';
  document.querySelectorAll('.pb.resizing').forEach(p=>p.classList.remove('resizing'));

  const {day,slotStart,initialSpan,curSpan,id}=st;
  if(curSpan!==initialSpan){
    if(curSpan>initialSpan){
      for(let s=slotStart+initialSpan;s<slotStart+curSpan;s++){allGrids[curChild][curMonth][day][s]=id}
    } else {
      for(let s=slotStart+curSpan;s<slotStart+initialSpan;s++){allGrids[curChild][curMonth][day][s]=null}
    }
    renderGrid();
  }
  resizeState=null;
}

function serializeMonth(child, month){
  const out={};
  DAYS.forEach(d=>{
    out[d]={};
    Object.entries(allGrids[child][month][d]).forEach(([s,v])=>{ if(v) out[d]['s'+s]=v; });
  });
  return out;
}
function deserializeMonth(raw, child, month){
  DAYS.forEach(d=>{
    allGrids[child][month][d]={};
    if(!raw[d]) return;
    Object.entries(raw[d]).forEach(([k,v])=>{
      const s=+k.replace('s','');
      allGrids[child][month][d][s]=v;
    });
  });
}

async function fbLoadMonth(){
  if(!window._fbLoadMonth){ alert('⚠️ Chưa cấu hình Firebase!'); return; }
  const child=curChild;
  fbStatus('⏳ Đang tải '+CHILDREN[child].name+'...','#D97706');

    if(!raw){ fbStatus('ℹ️ '+CHILDREN[child].name+' chưa có dữ liệu trên Cloud','#9B6375'); return; }
    deserializeMonth(raw, child, curMonth);
    const braw = await window._fbLoadBlocks(child);
    if(braw && braw.list){
      const customs = JSON.parse(braw.list);
      const defIds = new Set(allBlocks[child].filter(b=>b.type!=='custom').map(b=>b.id));
      allBlocks[child] = allBlocks[child].filter(b=>b.type!=='custom');
      customs.forEach(b=>{ if(!defIds.has(b.id)) allBlocks[child].push(b); });
    }
    renderPal(); renderGrid();
    fbStatus('✅ Đã tải '+CHILDREN[child].icon+' '+CHILDREN[child].name+'! ('+new Date().toLocaleTimeString('vi-VN')+')','#059669');
  } catch(err){

    console.error(err);
  }
}

};

async function makeWallpaperCanvas(){
  const EXP_SS=SS, EXP_SE=22*2;
  const W=2560,H=1440;
  const out=document.createElement('canvas');
  out.width=W;out.height=H;
  const ctx=out.getContext('2d');

  const grad=ctx.createLinearGradient(0,0,W,H);
  grad.addColorStop(0,'#FFF0F3');grad.addColorStop(0.5,'#F5F0FF');grad.addColorStop(1,'#EFF6FF');
  ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);
  [[150,110,260,'rgba(255,182,207,0.22)'],[2410,180,300,'rgba(196,181,253,0.20)'],
   [250,1300,200,'rgba(147,197,253,0.18)'],[2300,1300,220,'rgba(110,231,183,0.15)'],
   [1280,40,170,'rgba(255,213,227,0.22)']].forEach(([bx,by,br,bc])=>{
    const g=ctx.createRadialGradient(bx,by,0,bx,by,br);
    g.addColorStop(0,bc);g.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(bx,by,br,0,Math.PI*2);ctx.fill();
  });

  const PAD=36,TITLE_H=66,TIME_COL=72,DAY_HDR=60;
  const INNER_W=W-PAD*2,INNER_H=H-PAD*2;

  ctx.shadowColor='rgba(255,133,161,0.15)';ctx.shadowBlur=40;ctx.shadowOffsetY=8;
  ctx.fillStyle='rgba(255,248,250,0.97)';
  roundRect(ctx,PAD,PAD,INNER_W,INNER_H,20);ctx.fill();
  ctx.shadowColor='transparent';ctx.shadowBlur=0;ctx.shadowOffsetY=0;
  ctx.strokeStyle='rgba(255,182,207,0.55)';ctx.lineWidth=2;
  roundRect(ctx,PAD,PAD,INNER_W,INNER_H,20);ctx.stroke();

  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.font='bold 36px "Baloo 2",cursive,sans-serif';
  ctx.fillStyle='#FF85A1';
  ctx.fillText(CHILDREN[curChild].icon+'  Thời Khóa Biểu — '+CHILDREN[curChild].name+'  '+CHILDREN[curChild].icon,W/2,PAD+TITLE_H/2);

  const gx=PAD+TIME_COL, gy=PAD+TITLE_H+DAY_HDR;
  const GRID_W=INNER_W-TIME_COL, GRID_H=INNER_H-TITLE_H-DAY_HDR;
  const slots=EXP_SE-EXP_SS;
  const dayW=GRID_W/DAYS.length, slotH=GRID_H/slots;

  DAYS.forEach((day,di)=>{
    const cx=gx+di*dayW;
    ctx.fillStyle=di%2===0?'rgba(255,240,245,0.5)':'rgba(245,240,255,0.4)';
    ctx.fillRect(cx,PAD+TITLE_H,dayW,DAY_HDR);
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.font='bold 24px "Baloo 2",cursive,sans-serif';
    ctx.fillStyle='#3D1A24';
    ctx.fillText(day,cx+dayW/2,PAD+TITLE_H+DAY_HDR/2);
    if(di>0){ctx.strokeStyle='rgba(255,182,207,0.5)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(cx,PAD+TITLE_H);ctx.lineTo(cx,PAD+INNER_H);ctx.stroke();}
  });

  ctx.strokeStyle='rgba(255,133,161,0.5)';ctx.lineWidth=2.5;
  ctx.beginPath();ctx.moveTo(PAD,gy);ctx.lineTo(PAD+INNER_W,gy);ctx.stroke();

  for(let i=0;i<=slots;i++){
    const s=EXP_SS+i, y=gy+i*slotH;
    if(s%2===0){
      ctx.textAlign='right';ctx.textBaseline='middle';
      ctx.font='bold 16px Nunito,sans-serif';ctx.fillStyle='#9B6375';
      ctx.fillText(sl(s),PAD+TIME_COL-8,y+slotH*0.5);
      ctx.strokeStyle='rgba(255,133,161,0.3)';ctx.lineWidth=1;
    } else {
      ctx.strokeStyle='rgba(255,182,207,0.18)';ctx.lineWidth=0.5;
    }
    if(i<slots){ctx.beginPath();ctx.moveTo(gx,y);ctx.lineTo(gx+GRID_W,y);ctx.stroke();}
  }

  ctx.strokeStyle='rgba(255,182,207,0.4)';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(PAD,gy+GRID_H);ctx.lineTo(PAD+INNER_W,gy+GRID_H);ctx.stroke();
  ctx.strokeStyle='rgba(255,182,207,0.5)';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(gx,PAD+TITLE_H);ctx.lineTo(gx,gy+GRID_H);ctx.stroke();

  function drawBlockText(txt, timeStr, color, cx, by, bw, bh){
    const FONT_SIZE=26;
    const TIME_FONT_SIZE=26;
    const PAD_X=10;
    const maxW=bw-PAD_X*2;
    ctx.font=`bold ${FONT_SIZE}px Nunito,sans-serif`;
    let lines;
    if(ctx.measureText(txt).width<=maxW){
      lines=[txt];
    } else {
      const words=txt.split(' ');
      let line1=words[0], line2='';
      for(let w=1;w<words.length;w++){
        const candidate=words.slice(0,w+1).join(' ');
        if(ctx.measureText(candidate).width<=maxW) line1=candidate;
        else { line2=words.slice(w).join(' '); break; }
      }
      lines=line2?[line1,line2]:[line1];
    }
    const gap=FONT_SIZE*1.3;
    const showTime = !!timeStr && bh>=(lines.length*gap + TIME_FONT_SIZE*1.3 + 8);
    const blockCount = lines.length + (showTime?1:0);
    const startY = by+bh/2 - ((blockCount-1)*gap)/2;

    ctx.textAlign='center';ctx.textBaseline='middle';
    lines.forEach((line,i)=>{
      ctx.font=`bold ${FONT_SIZE}px Nunito,sans-serif`;
      ctx.fillStyle=color;
      ctx.fillText(line,cx,startY+i*gap);
    });
    if(showTime){
      ctx.font=`bold ${TIME_FONT_SIZE}px Nunito,sans-serif`;
      ctx.fillStyle=color;
      ctx.globalAlpha=0.8;
      ctx.fillText(timeStr,cx,startY+lines.length*gap);
      ctx.globalAlpha=1;
    }
  }

  DAYS.forEach((day,di)=>{
    const cx=gx+di*dayW;
    ctx.fillStyle=di%2===0?'rgba(255,240,245,0.12)':'rgba(245,240,255,0.10)';
    ctx.fillRect(cx,gy,dayW,GRID_H);

    const ug=grid[curMonth][day];
    const drawn={};
    for(let i=0;i<slots;i++){
      const s=EXP_SS+i, bid=ug[s];
      if(!bid||drawn[s]) continue;
      let end=s+1;
      while(end<EXP_SE&&ug[end]===bid) end++;
      for(let k=s;k<end;k++) drawn[k]=true;
      const b=getB(bid);if(!b) continue;
      const by=gy+(s-EXP_SS)*slotH, bh=(end-s)*slotH;
      ctx.fillStyle=b.bg;roundRect(ctx,cx+2,by+2,dayW-4,bh-4,6);ctx.fill();
      ctx.strokeStyle=b.border;ctx.lineWidth=1.5;roundRect(ctx,cx+2,by+2,dayW-4,bh-4,6);ctx.stroke();
      const timeStr=sl(s)+' - '+sl(end);
      drawBlockText(b.label,timeStr,b.color,cx+dayW/2,by,dayW,bh);
    }
  });

  return out;
}

function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.arcTo(x+w,y,x+w,y+r,r);
  ctx.lineTo(x+w,y+h-r);ctx.arcTo(x+w,y+h,x+w-r,y+h,r);ctx.lineTo(x+r,y+h);
  ctx.arcTo(x,y+h,x,y+h-r,r);ctx.lineTo(x,y+r);ctx.arcTo(x,y,x+r,y,r);ctx.closePath();
}

async function exportImage(){
  const loading=document.getElementById('export-loading');
  loading.style.display='block';loading.textContent='⏳ Đang tạo hình nền 2560×1440...';
  try{
    const canvas=await makeWallpaperCanvas();
    const a=document.createElement('a');a.download='thoikhoabieu_wallpaper.png';a.href=canvas.toDataURL('image/png');a.click();
  }catch(err){alert('Lỗi xuất ảnh: '+err.message);console.error(err)}
  loading.style.display='none';closeExportModal();
}

async function exportPDF(){
  const loading=document.getElementById('export-loading');
  loading.style.display='block';
  try{
    const canvas=await captureTable();
    const {jsPDF}=window.jspdf;
    const imgW=canvas.width,imgH=canvas.height;
    const pageW=297,pageH=210;
    const ratio=Math.min(pageW/imgW*3.7795275591,pageH/imgH*3.7795275591);
    const finalW=imgW*ratio/3.7795275591,finalH=imgH*ratio/3.7795275591;
    const offsetX=(pageW-finalW)/2,offsetY=(pageH-finalH)/2;
    const pdf=new jsPDF({orientation:'landscape',unit:'mm',format:'a4'});
    pdf.addImage(canvas.toDataURL('image/png'),'PNG',offsetX,offsetY,finalW,finalH);
    pdf.save('thoikhoabieu.pdf');
  }catch(err){alert('Lỗi xuất PDF: '+err.message)}
  loading.style.display='none';closeExportModal();
}

document.getElementById('export-modal').addEventListener('click',function(e){if(e.target===this) closeExportModal();});

renderPal();renderGrid();
</script>
